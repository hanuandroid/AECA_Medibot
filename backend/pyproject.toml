[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medibot-backend"
version = "1.0.0"
description = "MediBot - Advanced RAG healthcare knowledge assistant (FastAPI backend)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "openai>=1.40",
    "anthropic>=0.40",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
# Docling pulls in torch + layout models; only needed to (re)build the index.
ingest = [
    "docling>=2.15",
    "docling-core[chunking]>=2.20",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call the configured cloud LLM API (skipped when no API key is configured)",
    "index: tests that need the ingested Qdrant index (skipped when the index is missing)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prompt templates are prose; wrapping them would change what the LLM sees
"app/llm/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
